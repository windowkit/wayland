name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Publishes to npm through trusted publishing (OIDC): no token secret.
  # npmjs.com trusts this repository and this workflow file for
  # @windowkit/wayland, and the id-token below is what lets the job mint the
  # short-lived credential; provenance comes with it. Needs npm >= 11.5.1.
  #
  # 3.1.0, the first version, was published by hand: a trusted publisher can
  # only be configured on a package that already exists.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      # `prepack` builds dist/ and the protocol JSON and typings
      - run: npm publish
